name: update-grid-data

# Refreshes data/grid.json from Geoscience Australia: weekly, and on demand from the Actions tab.
on:
    workflow_dispatch:
    schedule:
        # Sundays 16:23 UTC = early Monday morning in Sydney.
        - cron: '23 16 * * 0'

permissions:
    contents: write

jobs:
    update-grid-data:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Fetch grid data
              run: node scripts/fetch-grid-data.mjs
            - name: Commit snapshot
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/grid.json
                  if git diff --cached --quiet; then
                    echo "No change in grid data."
                  else
                    git commit -m "Update grid data snapshot from Geoscience Australia"
                    git push
                  fi
