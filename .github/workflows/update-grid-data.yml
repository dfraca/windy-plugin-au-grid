name: update-grid-data

# Refreshes data/grid.json from Geoscience Australia. Run it manually from the Actions tab.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-grid-data:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Cross-origin check (informational)
              run: |
                  U='https://services.ga.gov.au/gis/rest/services/Electricity_Infrastructure/MapServer?f=json'
                  echo "== GA service, plain curl =="
                  curl -sS -m 60 -D - -o /dev/null "$U" | tr -d '\r' | head -12 || true
                  echo "== GA service, browser user agent, Origin windy.com =="
                  curl -sS -m 60 -D - -o /dev/null -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' \
                    -H 'Origin: https://www.windy.com' "$U" | tr -d '\r' | head -20 || true
            - name: Fetch grid data
              run: node scripts/fetch-grid-data.mjs
            - name: Commit snapshot
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/grid.json
                  if git diff --cached --quiet; then
                    echo "No change in grid data."
                  else
                    git commit -m "Update grid data snapshot from Geoscience Australia"
                    git push
                  fi
